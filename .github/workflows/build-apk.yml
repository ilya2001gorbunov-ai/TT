name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          ls -la www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk klip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: klip-apk
          path: klip.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Клип — последняя сборка
          body: Скачайте klip.apk и установите на Android.
          files: klip.apk
          make_latest: true
